[flags]
mem_as_value = true
show_table_scroll_position = true

[colors]
# cyan      1f88a2
# blue      2d77ce
# green     2e7d32
# sea green	3ca341
# grey      999999
# purple    7b1fa2
# magenta   a21f7b
# orange    ff9800
# red       d32f2f
# yellow    FFFF5F
# black     252526
# white     ECEFF4

# Represents the colour of table headers (processes, CPU, disks, temperature).
# all
table_header_color="#3ca341"
widget_title_color="#ECEFF4"
border_color="#777777"
highlighted_border_color="#2e7d32"
text_color="#ECEFF4"
selected_text_color="#ECEFF4"
selected_bg_color="#2e7d32"
graph_color="#ECEFF4"
# cpu
all_cpu_color="#ECEFF4"
avg_cpu_color="#d32f2f"
cpu_core_colors=["#5e81ac","#81a1c1","#d8dee9","#b48ead","#a3be8c","#ebcb8b","#d08770","#bf616a"]
# memory
ram_color="#2d77ce"
swap_color="#d32f2f"
# network
rx_color="#2d77ce"
tx_color="#d32f2f"

[[row]]
  ratio=30
  [[row.child]]
  type="cpu"
[[row]]
  ratio=30
  [[row.child]]
    type="mem"
  [[row.child]]
    type="net"
[[row]]
  ratio=40
  [[row.child]]
    type="proc"
    default=true
  [[row.child]]
    [[row.child.child]]
      type="temp"
    [[row.child.child]]
      type="disk"
