# Named frame layouts for herbstluftwm, one per variable. Read by monitor_tui.py.
#
# The variable name is the key; hlwm_tag_layouts.conf refers to a layout by it.
# `# lname:` on the line directly above is the human readable name shown in the
# TUI. It need not match the variable name. Values are single-quoted strings in
# `hc load` format, so they must not contain a single quote.
#
# Seeded from layouts.autostart (which still loads its own strings for now).
# The lname texts are placeholders; change them freely.

# lname: Max
max='(
    clients max:1
)'

# lname: Horizontal
horizontal='(
    clients horizontal:0
)'

# lname: Split - Horizontal
split='(
    split horizontal:0.5:0
        (clients vertical:0)
        (clients vertical:0)
)'

# lname: 3-way right
three_way_r='(
    split horizontal:0.5:1
        (clients horizontal:0)
        (split vertical:0.5:1
            (clients horizontal:0) (clients horizontal:0)
        )
)'

# lname: 3-way left
three_way_l='(
    split horizontal:0.5:1
        (split vertical:0.5:0
            (clients horizontal:0) (clients horizontal:0)
        )
        (clients horizontal:0)
)'

# lname: Grid
grid='(
    split horizontal:0.5:1
        (split vertical:0.5:1
            (clients horizontal:0) (clients horizontal:0)
        )
        (split vertical:0.5:0
            (clients horizontal:0) (clients horizontal:0)
        )
)'

# lname: Split - Vertical
split_vertical='(
    split vertical:0.5:0
        (clients max:0)
        (clients max:0)
)'
