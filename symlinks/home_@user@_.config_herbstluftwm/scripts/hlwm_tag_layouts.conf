# Which layout each tag gets, per connected set of monitors. Read by monitor_tui.py.
#
# Key:   the connected outputs, sorted and space-separated, exactly as
#        `monitor_reconcile.sh --key` prints them.
# Value: one line per tag: the tag name, a layout variable from hlwm_layouts.conf,
#        then optionally [instance:index ...], the programs that autostart onto the tag
#        (the instance is the one named in rules.autostart; tag_programs.sh reads it).
#        The tag may contain spaces. After the layout, optionally {n}: the key (1-9) that
#        selects the tag (Super+n); without it the key is the tag's position in the block.
#        Tags beyond those listed are padded to 9 with 1..9 (tags.sh).
#
# A set with no block, or a tag with no line, is shown as "unassigned".
# Seeded from layouts.autostart; both sets below start out the same.

declare -gA TAG_LAYOUTS=()

TAG_LAYOUTS["eDP-1"]="
primary|1   split         [spotify:00 rambox:00 vivaldi-stable:01 obsidian:01]
max|2  max
split|3  split
split|4  split
grid|5  grid
3wayR|6  three_way_r
3wayL|7  three_way_l
"

TAG_LAYOUTS["DP-4 eDP-1"]="
primary|1   split         [spotify:00 rambox:00 vivaldi-stable:01 obsidian:01]
max|2  max
split|3  split
split|4  split
grid|5  grid
3wayR|6  three_way_r
3wayL|7  three_way_l
"

TAG_LAYOUTS["PLACEHOLDER-3-MONITOR-KEY"]="
left|3   max  {3}  [spotify:00 rambox:01]
middle|1 horizontal {1}
right|2  max  {2}  [vivaldi-stable:00 obsidian:01]
split|4  split
3wayR|5  three_way_r
3wayL|6  three_way_l
grid|7   grid
"
