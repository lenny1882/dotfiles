# Which layout each tag gets, per connected set of monitors. Read by monitor_tui.py.
#
# Key:   the connected outputs, sorted and space-separated, exactly as
#        `monitor_reconcile.sh --key` prints them.
# Value: one line per tag: the tag name, then a layout variable from
#        hlwm_layouts.conf (the last word on the line; the tag may contain spaces).
#
# A set with no block, or a tag with no line, is shown as "unassigned".
# Seeded from layouts.autostart; both sets below start out the same.

declare -gA TAG_LAYOUTS=()

TAG_LAYOUTS["eDP-1"]="
left|3   max
middle|1 horizontal
right|2  max
split|4  split
3wayR|5  three_way_r
3wayL|6  three_way_l
grid|7   grid
"

TAG_LAYOUTS["DP-4 eDP-1"]="
left|3   max
middle|1 horizontal
right|2  max
split|4  split
3wayR|5  three_way_r
3wayL|6  three_way_l
grid|7   grid
"
