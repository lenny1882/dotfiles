# Known monitor layouts, sourced by monitor_reconcile.sh.
#
# Key:   the connected outputs, sorted (C locale) and space-separated,
#        exactly as `monitor_reconcile.sh --key` prints them.
# Value: one line per output: OUTPUT MODE [xrandr args...]
#          MODE is WxH, `auto` or `off`. If the monitor does not list a WxH
#          (its EDID was missing or rejected), the mode is created for it.
#          Extra args are passed to xrandr verbatim (--primary, --pos 0x0,
#          --right-of OUT, --rotate left, ...).
#
# Connected sets not listed here use the fallback in monitor_reconcile.sh
# (panel stays on). To turn the laptop panel off, give it `off` in a layout.

declare -gA LAYOUTS=()

# Laptop panel (primary) with the external monitor to its right, both on:
LAYOUTS["DP-4 eDP-1"]="
eDP-1 auto      --primary --pos 0x0
DP-4  1920x1080 --right-of eDP-1
"

# Laptop panel docked to a single external monitor, panel off:
# LAYOUTS["DP-4 eDP-1"]="
# DP-4  1920x1080 --primary --pos 0x0
# eDP-1 off
# "

# Three monitors with the panel kept on, below the middle one:
# LAYOUTS["DP-4 HDMI-1 HDMI-2 eDP-1"]="
# DP-4   1920x1080 --primary --pos 1920x0
# HDMI-1 1920x1080 --left-of DP-4
# HDMI-2 1920x1080 --right-of DP-4
# eDP-1  auto      --below DP-4
# "
